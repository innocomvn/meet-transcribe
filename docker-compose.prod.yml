# Docker Compose for Production
version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: meet-transcribe-backend-prod
    expose:
      - "8000"
    volumes:
      - backend-uploads:/app/uploads
      - backend-models:/root/.cache/huggingface
      - backend-logs:/app/logs
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - DATABASE_URL=sqlite+aiosqlite:///./meet_transcribe.db
      - WHISPER_MODEL=vinai/PhoWhisper-small
      - DEVICE=cpu
      - UPLOAD_DIR=/app/uploads
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
    env_file:
      - .env.production
    networks:
      - meet-transcribe-network
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    container_name: meet-transcribe-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - meet-transcribe-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  backend-uploads:
    driver: local
  backend-models:
    driver: local
  backend-logs:
    driver: local
  nginx-logs:
    driver: local

networks:
  meet-transcribe-network:
    driver: bridge
