version: '3.8'

services:
  # Node.js Backend
  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: meet-transcribe-backend-node
    ports:
      - "8000:8000"
    volumes:
      - ./backend-node:/app
      - /app/node_modules
      - backend-node-uploads:/app/uploads
      - backend-node-data:/app/data
    environment:
      # Server
      - PORT=8000
      - NODE_ENV=development

      # Database
      - DATABASE_PATH=/app/data/meet-transcribe.db

      # Transcription Provider (openai or assemblyai)
      - TRANSCRIPTION_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-key}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-your-assemblyai-key}

      # CORS
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    restart: unless-stopped
    networks:
      - meet-transcribe-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meet-transcribe-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - backend-node
    restart: unless-stopped
    networks:
      - meet-transcribe-network

volumes:
  backend-node-uploads:
    driver: local
  backend-node-data:
    driver: local

networks:
  meet-transcribe-network:
    driver: bridge
